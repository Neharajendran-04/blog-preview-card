<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    @font-face {
      font-family: 'Figtree';
      src: url('./assets/fonts/Figtree-VariableFont_wght.ttf');
    }

    body {
      margin: 0;
      background-color: hsl(47, 88%, 63%);
      display: flex;
      justify-content: center;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: 'Figtree', sans-serif;
    }

    .maindiv {
      box-sizing: border-box;
      background-color: hsl(0, 0%, 100%);
      padding: 22px;
      width: calc(100% - 40px);
      max-width: 384px;
      border-radius: 20px;
      border: solid 1px hsl(0, 0%, 7%);
      box-shadow: 8px 8px 0 0 hsl(0, 0%, 7%);
    }

    .learning {
      display: inline-block;
      background-color: hsl(47, 88%, 63%);
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: bold;
    }

    .para {
      color: hsl(0, 0%, 42%);
      line-height: 1.5;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .name {
      color: hsl(0, 0%, 7%);
      font-weight: 800;
    }

    h1 {
      font-size: 25px;
      font-weight: 800;
      color: hsl(0, 0%, 7%);
      line-height: 1.2;
    }
    h1:hover{
      color: hsl(47, 88%, 63%);
    }
    .published {
      color: hsl(0, 0%, 7%);
      cursor: pointer;
    }

    .avatar {
      width: 30px;
      height: 30px;
    }

    .maindiv>img {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <main class="maindiv">
    <img src="./assets/images/illustration-article.svg" alt="No article">
    <p class="learning">Learning</p>

    <p class="published">Published 21 Dec 2023</p>

    <h1>HTML & CSS foundations</h1>
    <p class="para">These languages are the backbone of every website, defining structure, content, and presentation.
    </p>
    <div class="profile">
      <img class="avatar" src="./assets/images/image-avatar.webp" alt="Greg hooper">
      <p class="name">Greg Hooper</p>
    </div>

  </main>
  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>

</html>
